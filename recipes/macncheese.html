        <h1>Mac N' Cheese</h1>
        <img scr="https://www.allrecipes.com/thmb/e8uotDI18ieXNBY0KpmtGKbxMRM=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/238691-Simple-Macaroni-And-Cheese-mfs_008-4x3-6ed91ba87a1344558aacc0f9ef0f4b41.jpg">
        <p>Quick, easy, and tasty macaroni and cheese dish. Fancy, designer mac and cheese often costs forty or fifty dollars to prepare when you have so many expensive cheeses, but they aren’t always the best tasting. This simple recipe is cheap and tasty.</p>
        <h3>Ingredients</h3>
        <ul>
            <li>1 (8 ounce) box elbow macaroni</li>
            <li>¼ cup butter</li>
            <li>¼ cup all-purpose flour</li>
            <li>½ teaspoon salt</li>
            <li>ground black pepper to taste</li>
            <li>2 cups milk</li>
            <li>2 cups shredded Cheddar cheese</li>
        </ul>
        <h3>Steps:</h3>
        <ol>
            <li>Gather the ingredients.</li>
            <li>Bring a large pot of lightly salted water to a boil. Cook elbow macaroni in the boiling water, stirring occasionally until tender yet firm to the bite, about 8 minutes.</li>
            <li>Meanwhile, melt butter in a saucepan over medium heat.</li>
            <li>Whisk in flour, salt, and black pepper until smooth, about 5 minutes.</li>
            <li>Slowly pour in milk, while constantly stirring; cook and stir until mixture is smooth and bubbling, about 5 minutes, making sure the milk doesnt burn.</li>
            <li>Add Cheddar cheese and stir until melted, 2 to 4 minutes.</li>
            <li>Drain macaroni and fold into cheese sauce until coated.</li>
            <li>Serve hot and enjoy!</li>
        </ol>
